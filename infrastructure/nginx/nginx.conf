# NOTE: Basic rate limiting is configured here. Detailed per‑endpoint limits will be added in Phase 4 (security).

events {
    worker_connections 1024;
}

http {
    upstream api {
        server api:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    # ── Rate limiting zones ────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=100r/m;

    server {
        listen 80;
        server_name localhost;

        # ── Security headers ──────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Health probes ──────────────────────────────────────────────────
        location ~ ^/(health|healthz|readyz) {
            proxy_pass http://api;
            proxy_set_header Host $host;
        }

        # ── API proxy ─────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_zone burst=50 nodelay;

            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for long-running requests (report generation etc.)
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ── Auth endpoints — stricter rate limiting ────────────────────────
        location /api/v1/auth/login {
            limit_req zone=auth_zone burst=5 nodelay;

            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Frontend proxy ─────────────────────────────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # WebSocket support for Vite HMR
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
